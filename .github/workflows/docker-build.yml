name: Publish Docker image (Multi-arch)

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v0.10.8-alpha.3)'
        required: true
        type: string
      registry:
        description: 'Registry to publish to'
        required: true
        type: choice
        options:
          - ghcr
          - dockerhub
      image:
        description: 'Override image name (default: ghcr.io/<repository>, or calciumion/new-api for dockerhub)'
        required: false
        type: string
      dockerhub_username:
        description: 'Docker Hub username (used only when registry=dockerhub)'
        required: false
        type: string

jobs:
  prepare:
    name: Prepare Docker target
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.resolve.outputs.registry }}
      image: ${{ steps.resolve.outputs.image }}
      dockerhub_username: ${{ steps.resolve.outputs.dockerhub_username }}
    steps:
      - name: Resolve Docker target
        id: resolve
        env:
          INPUT_REGISTRY: ${{ inputs.registry }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
          VAR_DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          VAR_DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          SECRET_DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          REGISTRY="${INPUT_REGISTRY:-ghcr}"
          if [ "$REGISTRY" = "dockerhub" ]; then
            if [ -n "$INPUT_IMAGE" ]; then
              IMAGE="$INPUT_IMAGE"
            elif [ -n "$VAR_DOCKERHUB_IMAGE" ]; then
              IMAGE="$VAR_DOCKERHUB_IMAGE"
            else
              IMAGE="calciumion/new-api"
            fi
            DOCKERHUB_USERNAME="${INPUT_DOCKERHUB_USERNAME:-${VAR_DOCKERHUB_USERNAME:-$SECRET_DOCKERHUB_USERNAME}}"
          else
            REGISTRY="ghcr"
            if [ -n "$INPUT_IMAGE" ]; then
              IMAGE="$INPUT_IMAGE"
            else
              IMAGE="ghcr.io/${{ github.repository }}"
            fi
            DOCKERHUB_USERNAME=""
          fi
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "dockerhub_username=$DOCKERHUB_USERNAME" >> "$GITHUB_OUTPUT"
          echo "Publishing to $REGISTRY as $IMAGE"

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      image: ${{ steps.version.outputs.image }}

    permissions:
      packages: write
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && 0 || 1 }}
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag & write VERSION
        id: version
        env:
          DOCKER_IMAGE: ${{ needs.prepare.outputs.image }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag '$TAG' does not exist"
              exit 1
            fi
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image=${DOCKER_IMAGE}" >> $GITHUB_OUTPUT
          echo "${TAG}" > VERSION
          echo "Building tag: ${TAG} for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.registry == 'dockerhub'
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ needs.prepare.outputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: needs.prepare.outputs.registry == 'ghcr'
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.prepare.outputs.image }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ needs.prepare.outputs.image }}:${{ env.TAG }}-${{ matrix.arch }}
            ${{ needs.prepare.outputs.image }}:latest-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign
        run: cosign sign --yes ${{ needs.prepare.outputs.image }}@${{ steps.build.outputs.digest }}

      - name: Image summary
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ needs.prepare.outputs.image }}:${TAG}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      packages: write
      id-token: write

    steps:
      - name: Set version
        run: echo "TAG=${{ needs.build_single_arch.outputs.tag }}" >> $GITHUB_ENV

      - name: Resolve Docker image
        run: echo "DOCKER_IMAGE=${{ needs.build_single_arch.outputs.image }}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.registry == 'dockerhub'
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          username: ${{ needs.prepare.outputs.dockerhub_username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: needs.prepare.outputs.registry == 'ghcr'
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (version)
        run: |
          docker buildx imagetools create \
            -t ${DOCKER_IMAGE}:${TAG} \
            ${DOCKER_IMAGE}:${TAG}-amd64 \
            ${DOCKER_IMAGE}:${TAG}-arm64

      - name: Create & push manifest (latest)
        run: |
          docker buildx imagetools create \
            -t ${DOCKER_IMAGE}:latest \
            ${DOCKER_IMAGE}:latest-amd64 \
            ${DOCKER_IMAGE}:latest-arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign manifests with cosign
        run: |
          cosign sign --yes ${DOCKER_IMAGE}:${TAG}
          cosign sign --yes ${DOCKER_IMAGE}:latest

      - name: Manifest summary
        run: |
          echo "### Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ${DOCKER_IMAGE}:${TAG} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
